name: Day Auto Swing Alert Engine

on:
  schedule:
    # প্রতিদিন ভোর 05:45 AM IST (00:15 UTC) এ স্বয়ংক্রিয়ভাবে চলবে
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Telegram Scanner
        run: python telegram_scanner.py
