name: Hourly Binance Forward Pump Tracker

on:
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Forensic Tracker
        run: |
          python hourly_forward_tracker.py

      - name: Check CSV File Content
        run: |
          echo "=== CSV Content Preview ==="
          cat forward_cycle_log.csv || true

      - name: Commit and Push Log Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add -f forward_cycle_log.csv
          git commit -m "Auto-update hourly forensic pump ledger [skip ci]" || echo "Nothing to commit"
          git push origin main
