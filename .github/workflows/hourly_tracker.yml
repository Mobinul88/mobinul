name: Hourly Binance Forward Pump Tracker

on:
  schedule:
    # ভারতীয় সময় প্রতি ঘণ্টার ক্যান্ডেল ক্লোজের পর (:32 মিনিটে) স্বয়ংক্রিয়ভাবে চলবে
    - cron: '32 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Forensic Tracker
        run: |
          python hourly_forward_tracker.py

      - name: Commit and Push Log Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update hourly forensic pump ledger [skip ci]" || echo "No changes to commit"
          git push
