name: Hourly Binance Forward Pump Tracker

on:
  schedule:
    # ভারতীয় সময় প্রতি ক্যান্ডেল ক্লোজের পর (যেমন: ৫:৩২ AM, ৬:৩২ AM, ৭:৩২ AM...) রান হবে
    - cron: '32 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Execute Hourly Tracker
        run: |
          python hourly_forward_tracker.py

      - name: Commit and Push Updated Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update hourly forward pump logs [skip ci]" && git push)
